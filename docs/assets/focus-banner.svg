<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-labelledby="title desc">
  <title id="title">Focus on the next step, not the summit.</title>
  <desc id="desc">A long book can feel like a mountain. Barii helps you move through it one small bite at a time.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d2418"/>
      <stop offset="1" stop-color="#102d20"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a9d27c"/>
      <stop offset="1" stop-color="#6f9f4f"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="1198" height="218" rx="22" fill="url(#bg)" stroke="#365b3b" stroke-width="2"/>

  <circle cx="116" cy="110" r="55" fill="#11291d" stroke="#45663d" stroke-width="2"/>
  <path d="M108 130 C88 121 82 105 86 87 C104 92 116 103 118 119 C121 99 133 86 151 81 C154 100 145 118 123 126 L121 145" fill="none" stroke="url(#leaf)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M116 72 l4 10 l10 4 l-10 4 l-4 10 l-4-10 l-10-4 l10-4z" fill="#d9b85f"/>

  <line x1="190" y1="48" x2="190" y2="172" stroke="#355541" stroke-width="2"/>

  <text x="235" y="92" fill="#f6f7f4" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="38" font-weight="700">Focus on the next step, not the summit.</text>
  <text x="235" y="138" fill="#c7cec9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="24">A long book can feel like a mountain. Barii helps you move through it</text>
  <text x="235" y="170" fill="#c7cec9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="24">one small bite at a time.</text>
</svg>
