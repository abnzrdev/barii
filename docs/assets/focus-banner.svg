<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">Focus on the next step, not the summit.</title>
  <desc id="desc">A long book can feel like a mountain. Barii helps you move through it one small bite at a time.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d2418"/>
      <stop offset="1" stop-color="#102d20"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="1198" height="258" rx="24" fill="url(#bg)" stroke="#365b3b" stroke-width="2"/>

  <text x="76" y="105" fill="#f7f2e8" font-family="Georgia,'Times New Roman',serif" font-size="44" font-weight="700" letter-spacing="0.2">Focus on the next step, not the summit.</text>
  <text x="78" y="162" fill="#cbd3cd" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="25">A long book can feel like a mountain. Barii helps you move through it</text>
  <text x="78" y="200" fill="#cbd3cd" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="25">one small bite at a time.</text>
</svg>
