name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.6

jobs:
  windows-build:
    needs: test
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Build Windows release
        run: flutter build windows --release --no-pub
      - name: Upload complete Windows bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: barii-windows-x64
          path: build/windows/x64/runner/Release/
          if-no-files-found: error

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        run: flutter analyze
      - name: Test migrations
        run: flutter test test/core/database/migration_test.dart
      - name: Test all
        run: mkdir -p build && flutter test --file-reporter json:build/test-results.json
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: flutter-test-results
          path: build/test-results.json
          if-no-files-found: warn

  android-build:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Compile unsigned release APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: barii-android-unsigned
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  linux-build:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Linux build dependencies
        run: >-
          sudo apt-get update && sudo apt-get install --yes
          clang cmake ninja-build pkg-config libgtk-3-dev
          libwebkit2gtk-4.1-dev
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Build Linux release
        run: flutter build linux --release
      - name: Verify runtime linkage
        run: |
          ldd build/linux/x64/release/bundle/barii | tee build/linux/ldd.txt
          ! grep -q 'not found' build/linux/ldd.txt
      - name: Upload Linux bundle and linkage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: barii-linux-x64
          path: |
            build/linux/x64/release/bundle/
            build/linux/ldd.txt
          if-no-files-found: error
